#   dental-clinic.cc is hosted on this droplet too (see docs/shared-droplet.md).
#   Its app runs in its own compose project (/opt/dental-clinic) and joins the
#   external "web" network, where this nginx reaches it by container name.

server {
    listen 80;
    server_name dental-clinic.cc www.dental-clinic.cc;

    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name dental-clinic.cc www.dental-clinic.cc;

    server_tokens off;
    client_max_body_size 20m;

    ssl_certificate /etc/letsencrypt/live/dental-clinic.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dental-clinic.cc/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Resolve the upstream per request through Docker's DNS instead of once at
    # startup: nginx (and so chefbey.org) still starts while the dental-clinic
    # app is down, and picks up the new container IP after each deploy.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $dental_clinic_app http://dental-clinic-app:3000;

    location / {
        proxy_pass $dental_clinic_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
