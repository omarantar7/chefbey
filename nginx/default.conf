server {
    listen 80;
    server_name chefbey.org www.chefbey.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://chefbey.org$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.chefbey.org;

    ssl_certificate /etc/letsencrypt/live/chefbey.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chefbey.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    return 301 https://chefbey.org$request_uri;
}

server {
    listen 443 ssl;
    server_name chefbey.org;

    ssl_certificate /etc/letsencrypt/live/chefbey.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chefbey.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # IP whitelisting — remove or expand this block if you want public access
    # allow YOUR_IP;
    # allow YOUR_OFFICE_SUBNET/24;
    # deny all;

    location / {
        # container name, not the "app" service name: nginx also sits on the shared
        # "web" network, where dental-clinic's service is called "app" too
        proxy_pass http://chefbey:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}