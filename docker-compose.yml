services:
  app:
    image: ghcr.io/omarantar7/chefbey:latest
    container_name: chefbey
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - chefbey_db:/app/data
      - chefbey_uploads:/app/.output/public/uploads
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: chefbey_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    depends_on:
      - app
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: chefbey_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'"


volumes:
  chefbey_db:
  chefbey_uploads:
  certbot_www:
  certbot_certs: