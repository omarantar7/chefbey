x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    image: ghcr.io/omarantar7/chefbey:latest
    container_name: chefbey
    # internal only — nginx reaches it over the compose network
    expose:
      - "3000"
    env_file:
      - .env
    volumes:
      - chefbey_db:/app/data
      - chefbey_uploads:/app/.output/public/uploads
    mem_limit: 512m
    logging: *default-logging
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: chefbey_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # whole directory, not single files: a file bind mount keeps pointing at the
      # old file after `git pull` replaces it, so a reload wouldn't see the change
      - ./nginx:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    # "web" is shared with other projects on this droplet (dental-clinic) so this
    # nginx can proxy to them — see docs/shared-droplet.md
    networks:
      - default
      - web
    depends_on:
      - app
    mem_limit: 64m
    logging: *default-logging
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: chefbey_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'"
    mem_limit: 128m
    logging: *default-logging


networks:
  web:
    external: true

volumes:
  chefbey_db:
  chefbey_uploads:
  certbot_www:
  certbot_certs:
