version: "3.8"

services:
  app:
    build:
      context: .
      args:
        BUN_ENV: ${BUN_ENV}
        ETHEREAL_USER: ${ETHEREAL_USER}
        ETHEREAL_PASS: ${ETHEREAL_PASS}
        BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
        BETTER_AUTH_URL: ${BETTER_AUTH_URL}
        CONTENT_LANGUAGES: ${CONTENT_LANGUAGES}
        BASE_URL: ${BASE_URL}
        NUXT_DB_FILE_NAME: ${NUXT_DB_FILE_NAME}
        GMAIL_USER: ${GMAIL_USER}
        GMAIL_APP_PASS: ${GMAIL_APP_PASS}
        RECIEVED_Email: ${RECIEVED_Email}
    image: chefbey:latest
    container_name: chefbey
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - chefbey_db:/app/data
      - chefbey_uploads:/app/.output/public/uploads
    restart: unless-stopped
  nginx:
    image: nginx:alpine
    container_name: chefbey_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    depends_on:
      - app
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: chefbey_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  chefbey_db:
  chefbey_uploads:
  certbot_www:
  certbot_certs: