name: Deploy to Production

on:
  push:
    branches:
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: omarantar7/chefbey

jobs:
  # ─── Job 1: Build & Push Image ───────────────────────────────
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN  }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image`
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.IMAGE_NAME }}:latest
          build-args: |
            CONTENT_LANGUAGES=${{ vars.CONTENT_LANGUAGES }}
            BUN_ENV=${{ vars.BUN_ENV }}
            ETHEREAL_USER=${{ secrets.ETHEREAL_USER }}
            ETHEREAL_PASS=${{ secrets.ETHEREAL_PASS }}
            BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}
            BETTER_AUTH_URL=${{ vars.BETTER_AUTH_URL }}
            BASE_URL=${{ vars.BASE_URL }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            RECIEVED_Email=${{ secrets.RECIEVED_Email }}
            NUXT_PUBLIC_GA_ID=${{ secrets.NUXT_PUBLIC_GA_ID }}
            RECAPTCHA_SITE_KEY=${{ vars.RECAPTCHA_SITE_KEY }}
            RECAPTCHA_SECRET_KEY=${{ secrets.RECAPTCHA_SECRET_KEY }}
          cache-from: type=registry,ref=ghcr.io/${{ env.IMAGE_NAME }}:cache
          cache-to: type=registry,ref=ghcr.io/${{ env.IMAGE_NAME }}:cache,mode=max

  # ─── Job 2: Deploy ───────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ${{ secrets.PATH }}
            git pull origin master
            echo ${{ secrets.GH_TOKEN }} | docker login ghcr.io -u omarantar7 --password-stdin
            docker compose pull app
            docker compose up -d --no-build
            docker image prune -f
            docker exec chefbey_nginx nginx -s reload